<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Orfix – Entwurf E</title>
  <style>
    /* Draft E: printer first, then nozzle, then one tree of filaments with a switch each.
       Colours, radii and button shapes follow OrcaSlicer (StateColor.cpp, web/include/global.css),
       so Orfix looks like it belongs to the slicer. */
    @font-face {
      font-family: "HarmonyOS Sans SC";
      src: url("assets/fonts/HarmonyOS_Sans_SC_Regular.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "HarmonyOS Sans SC";
      src: url("assets/fonts/HarmonyOS_Sans_SC_Bold.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }

    /* Font comparison for the draft: Orca's HarmonyOS Sans, Inter (OFL) or the system font. */
    @font-face {
      font-family: "Inter";
      src: url("../../orfix/static/vendor/inter/InterVariable.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    :root[data-font="inter"] { --font: "Inter", system-ui, "Segoe UI", Roboto, sans-serif !important; }
    :root[data-font="system"] { --font: system-ui, "Segoe UI", Roboto, sans-serif !important; }
    .font-switch {
      position: fixed; left: 12px; bottom: 12px; z-index: 50;
      display: flex; align-items: center; gap: 2px; padding: 3px;
      background: var(--surface); border: 1px solid var(--line-box); border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); font: 12px/1 var(--font);
    }
    .font-switch span { color: var(--muted); padding: 0 6px 0 4px; }
    .font-switch button {
      height: 24px; padding: 0 10px; border: 0; border-radius: 4px;
      background: none; color: var(--text); font: inherit; cursor: pointer;
    }
    .font-switch button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
    .font-switch button:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 1px; }

    :root {
      --font: "HarmonyOS Sans SC", system-ui, "Segoe UI", Roboto, sans-serif;
      --panel-w: 380px;

      --accent: #009688;        /* fills: primary button, switch */
      --accent-hover: #26A69A;
      --accent-text: #00796B;   /* text and icons on light surfaces, 5.3:1 */
      --accent-line: #009688;   /* borders, focus ring */
      --on-accent: #FEFEFE;
      --bg: #F0F0F0;
      --surface: #FFFFFF;
      --surface-2: #F4F4F4;
      --header: #3B4446;
      --line-input: #DBDBDB;
      --line-box: #CECECE;
      --divider: #EEEEEE;
      --text: #262E30;
      --label: #363636;
      --muted: #5F6666;         /* Orca uses #7C8282, too faint for small text */
      --icon: #7C8282;
      --disabled-text: #ACACAC;
      --disabled-bg: #F0F0F1;
      --btn: #DFDFDF;
      --btn-hover: #D4D4D4;
      --row-hover: #F1F1F1;
      --selected: #BFE1DE;
      --focus-bg: #E5F0EE;
      --error: #D32F2F;
      --error-bg: #FDE8E8;
      --danger: #E14747;
      --warn: #FF842D;
      --warn-bg: #FFF3EB;
      --changed: #F1754E;
      --success: #34A853;
      --toggle-off: #D9D9D9;
      --brass: #C9A04E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #00675B;
        --accent-hover: #008172;
        --accent-text: #26A69A;
        --accent-line: #26A69A;
        --bg: #242428;
        --surface: #2D2D31;
        --surface-2: #36363B;
        --header: #2D2D30;
        --line-input: #4A4A51;
        --line-box: #54545B;
        --divider: #4C4C55;
        --text: #EFEFF0;
        --label: #B2B3B5;
        --muted: #A2A3A6;
        --icon: #949494;
        --disabled-text: #65656A;
        --disabled-bg: #333337;
        --btn: #3E3E45;
        --btn-hover: #4D4D54;
        --row-hover: #36363B;
        --selected: #223C3C;
        --focus-bg: #283232;
        --error: #EF5350;
        --error-bg: #4D2020;
        --warn: #FF9F43;
        --warn-bg: #452A1A;
        --success: #4CAF50;
        --toggle-off: #4A4A51;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); }
    h1, h2, h3, h4, p, dl, dd { margin: 0; }
    button, input, select { font: inherit; color: inherit; }
    a { color: var(--accent-text); }
    :focus-visible { outline: 2px solid var(--accent-line); outline-offset: 2px; }
    [tabindex="-1"]:focus { outline: none; }
    .icon { flex: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Top bar, dark like Orca's title bar */
    .topbar {
      position: sticky; top: 0; z-index: 20; height: 48px;
      display: flex; align-items: center; gap: 12px; padding: 0 16px;
      background: var(--header); color: #fff; border-bottom: 1px solid rgba(255, 255, 255, .06);
    }
    .brand { display: flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; font-size: 17px; font-weight: 700; }
    .draft { margin-left: auto; padding: 2px 10px; border: 1px solid rgba(255, 255, 255, .35); border-radius: 12px; color: rgba(255, 255, 255, .85); font-size: 12px; white-space: nowrap; }
    .top-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 0; border-radius: 4px; background: none; color: #fff; cursor: pointer; }
    .top-btn:hover { background: rgba(255, 255, 255, .12); }
    .topbar :focus-visible { outline-color: #fff; }

    .main { padding: 24px 16px 96px; }
    .main.with-panel { padding-right: calc(var(--panel-w) + 16px); }
    .page { max-width: 860px; margin: 0 auto; }

    /* Buttons and inputs */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 32px; padding: 0 14px; border: 0; border-radius: 4px;
      background: var(--btn); color: var(--text); cursor: pointer; white-space: nowrap; text-decoration: none;
    }
    .btn:hover { background: var(--btn-hover); }
    .btn-primary { background: var(--accent); color: var(--on-accent); font-weight: 700; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn:disabled { background: var(--disabled-bg); color: var(--disabled-text); cursor: not-allowed; }
    .icon-btn { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 4px; background: none; color: var(--icon); cursor: pointer; }
    .icon-btn:hover { background: var(--btn-hover); color: var(--text); }
    .link { padding: 0; border: 0; background: none; color: var(--accent-text); text-decoration: underline; cursor: pointer; }
    .input {
      height: 32px; padding: 0 10px; border: 1px solid var(--line-input); border-radius: 4px;
      background: var(--surface); color: var(--text);
    }
    .input:hover { border-color: var(--accent-line); }
    .input:focus { outline: none; border-color: var(--accent-line); background: var(--focus-bg); }

    .status { display: inline-flex; align-items: center; gap: 6px; color: var(--label); font-size: 13px; white-space: nowrap; }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
    .status--busy::before { background: var(--warn); }

    /* Home */
    .home h1 { margin-bottom: 20px; font-size: 20px; font-weight: 700; }
    .install { margin-bottom: 28px; }
    .install-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 10px; }
    .install-head h2 { font-size: 16px; font-weight: 700; }
    .install-head .version { color: var(--muted); }
    .install-head .status { margin-left: auto; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .card {
      display: flex; flex-direction: column; gap: 4px; padding: 12px 12px 14px;
      background: var(--surface); border: 1px solid var(--line-box); border-radius: 8px;
      color: inherit; text-decoration: none;
    }
    .card:hover { border-color: var(--accent-line); }
    .card-img { display: grid; place-items: center; height: 190px; margin-bottom: 6px; border-radius: 6px; background: var(--surface-2); }
    .card-img img { width: 170px; height: 170px; object-fit: contain; }
    .card-name { font-size: 16px; font-weight: 700; }
    .card-sub { margin-top: -4px; color: var(--muted); font-size: 12px; }
    .card-meta { display: flex; align-items: center; gap: 6px; color: var(--label); font-size: 13px; }
    .card-spools { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; min-height: 30px; margin-top: 6px; color: var(--muted); font-size: 12px; }
    .spool { flex: none; }
    .credits { margin-top: 36px; color: var(--muted); font-size: 12px; }

    /* Printer view */
    .printer-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .bar-img { width: 48px; height: 48px; padding: 2px; object-fit: contain; background: var(--surface); border: 1px solid var(--line-box); border-radius: 6px; }
    .bar-title { flex: 1; min-width: 0; }
    .bar-title h1 { font-size: 20px; font-weight: 700; line-height: 1.2; }
    .bar-title span { color: var(--muted); font-size: 13px; }
    .banner { margin-bottom: 16px; padding: 10px 14px; border-left: 3px solid var(--warn); border-radius: 4px; background: var(--warn-bg); }

    .box { margin-bottom: 16px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line-box); border-radius: 8px; }
    .box-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 12px; }
    .box-head h2 { font-size: 16px; font-weight: 700; }
    .box-head .sub { color: var(--muted); font-size: 13px; }
    .count { min-width: 22px; padding: 0 7px; border-radius: 11px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; }

    .nozzles { display: flex; align-items: center; gap: 14px; }
    .nozzles > h2 { flex: none; font-size: 16px; font-weight: 700; }
    .nozzle-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .nozzle-tile {
      flex: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px;
      min-width: 76px; height: 78px; padding: 6px 10px; border: 1px solid var(--line-input); border-radius: 8px;
      background: var(--surface); color: var(--label); font-size: 13px; cursor: pointer;
    }
    .nozzle-tile:hover { border-color: var(--accent-line); }
    .nozzle-tile[aria-pressed="true"] { padding: 5px 9px; border: 2px solid var(--accent-line); background: var(--focus-bg); color: var(--accent-text); font-weight: 700; }
    .nz-body { fill: var(--icon); }
    .nz-tip { fill: var(--brass); }
    .nz-flow { fill: var(--accent-line); }

    /* Shelf: what the slicer shows for this printer */
    .shelf.drop-ready { outline: 2px dashed var(--accent-line); outline-offset: -3px; background: var(--focus-bg); }
    .shelf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
    .tile { position: relative; }
    .tile-main {
      display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; padding: 12px 6px 10px;
      border: 1px solid var(--line-input); border-radius: 8px; background: var(--surface); text-align: center; cursor: pointer;
    }
    .tile-main:hover { border-color: var(--accent-line); }
    .tile-main[aria-current="true"] { border-color: var(--accent-line); background: var(--selected); }
    .tile-name { display: -webkit-box; overflow: hidden; font-size: 13px; font-weight: 700; line-height: 1.25; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .tile-sub { color: var(--muted); font-size: 12px; }
    .partly { color: var(--accent-text); }
    .tile-off { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; }
    .empty { padding: 14px; border: 1px dashed var(--line-box); border-radius: 8px; color: var(--muted); text-align: center; }

    /* Catalogue: search, filters and the tree */
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
    .search { position: relative; flex: 1 1 200px; }
    .search .icon { position: absolute; top: 7px; left: 9px; color: var(--icon); }
    .search input { width: 100%; padding-left: 34px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px;
      border: 1px solid var(--line-input); border-radius: 14px; background: var(--surface); font-size: 13px; cursor: pointer;
    }
    .chip:hover { border-color: var(--accent-line); }
    .chip[aria-pressed="true"] { border-color: var(--accent-line); background: var(--selected); font-weight: 700; }
    .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; }

    .kind { border-top: 1px solid var(--divider); }
    .kind:first-child { border-top: 0; }
    .kind h3, .brand-h { font-size: inherit; font-weight: inherit; }
    .kind-head, .brand-head {
      width: 100%; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 4px;
      background: none; text-align: left; cursor: pointer;
    }
    .kind-head { height: 48px; padding: 0 8px 0 2px; }
    .brand-head { height: 36px; padding: 0 8px 0 4px; }
    .kind-head:hover, .brand-head:hover { background: var(--row-hover); }
    .chev { color: var(--icon); transition: transform .12s; }
    [aria-expanded="true"] > .chev { transform: rotate(90deg); }
    .kind-icon { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 6px; background: var(--focus-bg); color: var(--accent-text); }
    .kind-title { font-size: 15px; font-weight: 700; }
    .brand-title { font-weight: 700; }
    .stand { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
    .stand.has-on { color: var(--accent-text); font-weight: 700; }
    .mini-spools + .stand { margin-left: 8px; }
    /* Nothing switched on: the head looks like a switched-off row */
    .is-empty .kind-title, .is-empty .brand-title { color: var(--muted); font-weight: 400; }
    .is-empty .kind-icon { background: var(--surface-2); color: var(--icon); }
    .mini-spools { display: flex; gap: 1px; margin-left: auto; }
    .kind-note { margin: -4px 0 8px 40px; color: var(--muted); font-size: 13px; }
    .kind-body { margin: 0 0 8px 13px; padding-left: 12px; border-left: 1px solid var(--divider); }
    .rows { margin: 0; padding: 0; list-style: none; }
    .brand-group .rows { margin-left: 12px; padding-left: 12px; border-left: 1px solid var(--divider); }

    .row { display: flex; align-items: center; gap: 6px; min-height: 46px; padding: 0 8px 0 0; border-radius: 4px; }
    .row:hover { background: var(--row-hover); }
    .row.is-selected { background: var(--selected); }
    .row.is-fresh { animation: fresh 2.4s ease-out; }
    @keyframes fresh { from { background: var(--selected); } }
    .grip { color: var(--icon); opacity: 0; cursor: grab; }
    .row:hover .grip, .row:focus-within .grip { opacity: 1; }
    .row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 0; border-radius: 4px; cursor: pointer; }
    .row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .row-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .is-on .row-name, .is-some .row-name { font-weight: 700; }
    .is-off .row-name { color: var(--muted); }
    .is-off .spool, .dim { filter: grayscale(1); opacity: .45; }
    .row-hint { color: var(--muted); font-size: 12px; }
    .row-hint.on { color: var(--accent-text); }
    .row-hint.bad { color: var(--error); }
    .mat { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 11px; background: var(--surface-2); color: var(--label); font-size: 12px; white-space: nowrap; }
    .badge { padding: 0 8px; border: 1px solid var(--accent-line); border-radius: 11px; color: var(--accent-text); font-size: 12px; white-space: nowrap; }
    .lock { color: var(--icon); }

    /* Switch in Orca's shape: a small rounded rectangle, not a pill */
    .switch { position: relative; flex: none; width: 38px; height: 22px; padding: 0; border: 0; border-radius: 5px; background: var(--toggle-off); cursor: pointer; }
    .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 14px; height: 14px; border-radius: 3px; background: #fff; transition: left .12s; }
    .switch[aria-checked="true"] { background: var(--accent); }
    .switch[aria-checked="true"]::after { left: 20px; }
    .switch[aria-checked="mixed"] { background: linear-gradient(90deg, var(--accent) 50%, var(--toggle-off) 50%); }
    .switch[aria-checked="mixed"]::after { left: 12px; }
    .switch:disabled { opacity: .45; cursor: not-allowed; }
    .switch-gap { flex: none; width: 38px; }

    .no-hits { padding: 8px 0 12px; color: var(--muted); }

    /* Drop targets that appear while dragging, so nobody has to scroll with a filament in hand */
    .dock {
      position: fixed; top: 58px; left: 50%; z-index: 30; transform: translateX(-50%);
      display: flex; gap: 8px; padding: 8px; background: var(--surface);
      border: 1px solid var(--line-box); border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, .18);
    }
    .dock-target {
      display: flex; align-items: center; gap: 8px; min-width: 170px; height: 52px; padding: 0 16px;
      border: 2px dashed var(--accent-line); border-radius: 6px; background: var(--focus-bg); color: var(--accent-text); font-weight: 700;
    }

    /* Side panel */
    .panel {
      position: fixed; top: 48px; right: 0; bottom: 0; z-index: 15; width: var(--panel-w);
      display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line-box);
    }
    .panel-head { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--divider); }
    .panel-head h2 { flex: 1; font-size: 16px; font-weight: 700; }
    .panel-body { flex: 1; overflow: auto; padding: 16px 16px 24px; }
    .panel-body h3 { margin: 20px 0 8px; font-size: 13px; font-weight: 700; color: var(--label); }
    .hero { display: flex; align-items: center; gap: 16px; }
    .hero-text { min-width: 0; }
    .hero-switch { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-weight: 700; }
    .hero-name { font-size: 18px; font-weight: 700; line-height: 1.25; }
    .hero-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; color: var(--label); }
    .kind-chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--accent-text); font-size: 13px; }
    .alert { margin-top: 14px; padding: 10px 12px; border-radius: 4px; background: var(--error-bg); color: var(--error); }
    .from { margin-top: 14px; }
    .swatches { display: flex; flex-wrap: wrap; gap: 5px; }
    .swatch { width: 20px; height: 20px; border: 1px solid rgba(0, 0, 0, .18); border-radius: 50%; }
    .values { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .value { display: grid; grid-template-columns: 24px 1fr; column-gap: 8px; align-items: center; padding: 10px; border-radius: 6px; background: var(--surface-2); }
    .value .icon { grid-row: span 2; color: var(--accent-text); }
    .value dt { color: var(--muted); font-size: 12px; }
    .value dd { font-size: 16px; font-weight: 700; }
    .own-dot { display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: var(--changed); vertical-align: middle; }
    .legend { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .nz-toggles { display: flex; flex-wrap: wrap; gap: 6px; }
    .scope { display: flex; align-items: center; gap: 8px; margin-top: 20px; color: var(--label); }
    .nz-toggle { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line-input); border-radius: 4px; background: var(--surface); cursor: pointer; }
    .nz-toggle:hover { border-color: var(--accent-line); }
    .nz-toggle[aria-checked="true"] { border-color: var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 700; }
    .nz-toggle:disabled { opacity: .5; cursor: not-allowed; }
    .note { margin-top: 8px; color: var(--muted); font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
    .actions .right { margin-left: auto; }
    .field { display: flex; flex-direction: column; gap: 4px; margin-top: 16px; }
    .picker { min-width: 0; margin: 0; padding: 0; border: 0; }
    .picker legend { padding: 0; font-size: 16px; font-weight: 700; }
    .picker .search { display: block; }
    .pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
    .pick-hits { margin-top: 8px; }
    .pick {
      display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px;
      border: 1px solid var(--line-input); border-radius: 8px; background: var(--surface); text-align: center; cursor: pointer;
    }
    .pick:hover { border-color: var(--accent-line); }
    .pick[aria-pressed="true"] { padding: 7px 3px; border: 2px solid var(--accent-line); background: var(--selected); }
    .pick-name { display: -webkit-box; overflow: hidden; font-size: 13px; font-weight: 700; line-height: 1.25; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .pick-sub { color: var(--muted); font-size: 12px; }
    .field > span { color: var(--label); font-size: 13px; font-weight: 700; }

    .plain-list { margin: 0; padding: 0; list-style: none; }
    .plain-list li { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--divider); }
    .plain-list small { display: block; color: var(--muted); font-size: 12px; }
    .plain-list .grow { flex: 1; }
    .ch-on { color: var(--accent-text); }
    .ch-off, .ch-delete { color: var(--icon); }

    /* Pending changes */
    .changebar {
      position: fixed; right: 0; bottom: 0; left: 0; z-index: 14;

    .toast {
      position: fixed; bottom: 70px; left: 50%; z-index: 40; transform: translateX(-50%);
      max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 6px; background: #3B4446; color: #fff; font-size: 13px;
      opacity: 0; pointer-events: none; transition: opacity .15s;
    }

    @media (max-width: 900px) {
      .main.with-panel { padding-right: 16px; }
      .changebar.with-panel { right: 0; }
      .panel { width: min(var(--panel-w), 100%); box-shadow: -6px 0 20px rgba(0, 0, 0, .2); }
    }
    @media (max-width: 700px) {
      .main { padding: 16px 16px 96px; }
      .draft-long, .top-btn .label { display: none; }
      .nozzles { flex-direction: column; align-items: stretch; gap: 8px; }
      .grip { display: none; }
      .cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
      .card-img { height: 120px; }
      .card-img img { width: 104px; height: 104px; }

    @media (max-width: 480px) {

      .shelf-grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
      .printer-bar .status { flex-basis: 100%; }
      .nozzle-tile { min-width: 64px; }
    }
    @media (min-width: 701px) { .draft-short { display: none; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
  <script src="../../orfix/static/vendor/vue.global.prod.js"></script>
